[project]
name = "paddle-ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "freexiaochuan", email = "w2239559319@myyahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.0.0",
    "numpy>=2.3.5",
    "paddleocr>=3.7.0",
    "paddlepaddle-gpu>=3.4.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
paddle-ocr = "paddle_ocr:main"


[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle" }
